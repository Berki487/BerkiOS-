# BerkiOS — build a bootable live ISO with Debian live-build.
# Runs on demand, on every push to main, and monthly (1st, 03:00 UTC)
# so the ISO is rebuilt from the latest Debian trixie packages.
name: Build BerkiOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 1 * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub runners are tight on disk; a Debian live build needs
      # several GB. Remove the big pre-installed toolchains first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring \
            xorriso squashfs-tools syslinux-common isolinux

      # lb config reads auto/config; lb build produces
      # live-image-amd64.hybrid.iso in the repo root.
      - name: Build ISO
        run: |
          sudo lb config
          sudo lb build
          ls -lh live-image-amd64.hybrid.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: berkios-iso
          path: live-image-amd64.hybrid.iso
          if-no-files-found: error
